[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dserver-signed-url-plugin"
description = "dserver plugin for generating signed URLs for dataset access"
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de"},
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "dtoolcore>=3.18.0",
    "dtool-s3",
    "dservercore>0.18.0",
    "flask-smorest",
    "marshmallow",
]

[project.optional-dependencies]
test = [
    "dservercore",
    "pytest",
    "pytest-cov",
]
azure = [
    "dtool-azure",
]

[project.urls]
Repository = "https://github.com/jic-dtool/dserver-signed-url-plugin"

[project.entry-points."dservercore.extension"]
SignedURLExtension = "dserver_signed_url_plugin:SignedURLExtension"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dserver_signed_url_plugin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dserver_signed_url_plugin"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dserver_signed_url_plugin --cov-report=term-missing"
