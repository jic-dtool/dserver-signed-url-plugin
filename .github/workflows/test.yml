name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    # The endpoint tests start a dservercore app, whose search and retrieve
    # plugins need MongoDB (see tests/conftest.py).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    # dservercore and dtool-s3 are installed from git: the signing API this
    # plugin uses is not in a dtool-s3 release yet, and the released
    # dservercore resolves to a flask-smorest that does not work with the
    # Flask it gets alongside (ImportError: MethodViewType).
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          "dservercore @ git+https://github.com/jic-dtool/dservercore.git@main" \
          "dtool-s3 @ git+https://github.com/jic-dtool/dtool-s3.git@master" \
          "dserver-search-plugin-mongo @ git+https://github.com/jic-dtool/dserver-search-plugin-mongo.git@main" \
          "dserver-retrieve-plugin-mongo @ git+https://github.com/jic-dtool/dserver-retrieve-plugin-mongo.git@main"
        pip install -e ".[test]" flake8
        pip list

    - name: Lint
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test
      run: pytest -v -rfEs
